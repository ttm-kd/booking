<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin แพทย์แผนจีน — รพ.ควนโดน</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--pri:#8B4513;--pri-dk:#5C2E0A;--pri-lt:#F5E6D3;--accent:#C41E3A;
      --cream:#FAF5EF;--gold:#D4A017;--gold-lt:#FFF8E1;--white:#FFF;--red:#C0392B;
      --g50:#FAF9F7;--g100:#F3F1ED;--g200:#E5E2DB;--g300:#C8C4BB;--g400:#9C9890;--g500:#706C65;--g600:#524F49;--g700:#3A3835;--g800:#252422;
      --r:14px;--rs:10px;--tr:.25s ease}
    body{font-family:'Sarabun',sans-serif;background:var(--cream);color:var(--g800);line-height:1.6;font-size:16px}
    .hdr{background:linear-gradient(135deg,var(--pri-dk),var(--pri));padding:16px 20px;color:#fff;display:flex;align-items:center;justify-content:space-between}
    .hdr h1{font-size:16px;font-weight:700}.hdr p{font-size:12px;color:rgba(255,255,255,.6)}
    .hdr-tag{background:var(--gold);color:var(--g800);font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px}
    .tabs{display:flex;background:#fff;border-bottom:2px solid var(--g200);position:sticky;top:0;z-index:50}
    .tab{flex:1;padding:12px;text-align:center;font-size:14px;font-weight:600;color:var(--g400);cursor:pointer;border-bottom:3px solid transparent;transition:all var(--tr)}
    .tab.on{color:var(--pri);border-bottom-color:var(--pri);background:var(--pri-lt)}
    .panel{display:none;padding:16px}.panel.on{display:block}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
    .stat{background:#fff;border-radius:var(--r);padding:12px;text-align:center;border:1px solid var(--g200)}
    .stat-n{font-size:22px;font-weight:700}.stat-l{font-size:11px;color:var(--g500)}
    .fi{width:100%;padding:12px;border:2px solid var(--g200);border-radius:var(--rs);font-size:16px;font-family:inherit;color:var(--g800);background:var(--white)}
    .fi:focus{outline:none;border-color:var(--pri)}
    .btn{padding:12px 20px;border-radius:var(--rs);font-size:14px;font-weight:700;border:none;cursor:pointer;font-family:inherit}
    .btn-p{background:var(--pri);color:var(--white)}.btn-g{background:var(--gold);color:var(--g800)}
    .tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--g200);background:#fff;margin-bottom:16px}
    .tbl{width:100%;border-collapse:collapse;font-size:13px}
    .tbl th{padding:10px 8px;font-weight:700;text-align:center;border:1px solid var(--g200)}
    .tbl td{padding:8px;border:1px solid var(--g200);vertical-align:top;min-width:120px;height:78px}
    .tbl .th-period{background:var(--pri);color:#fff;font-size:14px}
    .tbl .th-time{background:var(--pri-lt);color:var(--pri-dk);font-size:12px}
    .tbl .th-num{background:var(--g100);color:var(--g600);font-size:11px;width:40px}
    .td-booked{background:#E8F5E9}
    .td-walkin{background:#FFF3E0}
    .td-empty{background:#fff}
    .p-name{font-weight:700;color:var(--g800);font-size:13px}
    .p-svc{font-size:11px;color:var(--pri)}
    .p-ins{font-size:10px;color:var(--g400)}
    .p-actions{margin-top:4px}
    .p-btn{font-size:10px;padding:2px 8px;border-radius:4px;border:none;cursor:pointer;font-family:inherit;font-weight:600}
    .ld{display:flex;flex-direction:column;align-items:center;padding:30px;color:var(--g400)}
    .sp{width:28px;height:28px;border:3px solid var(--g200);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty{text-align:center;padding:24px;color:var(--g400)}
    .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--g800);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;font-weight:600;z-index:200}
    .search-result{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:8px;border:1px solid var(--g200)}
    .fg{margin-bottom:12px}
    .fl{display:block;font-size:14px;font-weight:600;margin-bottom:4px;color:var(--g700)}
    .legend{font-size:12px;color:var(--g400);text-align:center;margin-top:8px}
    .hidden{display:none!important}
    .refresh-btn{width:36px;height:36px;border-radius:var(--rs);border:1px solid var(--g200);background:#fff;font-size:16px;cursor:pointer;flex-shrink:0}
    .refresh-btn.spin{animation:rspin 1s linear infinite}
    @keyframes rspin{to{transform:rotate(360deg)}}
    .upd-note{font-size:11px;color:var(--g400);text-align:center;margin:-8px 0 10px}
    /* v3 */
    .hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
    .win-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:5px 10px;font-size:12px;line-height:1.45;text-align:right;color:#fff}
    .win-badge b{color:#FDE68A}
    .td-advance{background:#EEF2FF}
    .date-note{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;border-radius:var(--rs);padding:16px;text-align:center;font-size:14px;line-height:1.7;margin-bottom:12px}
    .conflict{background:#FEF2F2;border:1px solid #FECACA;border-radius:var(--rs);padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.6;color:#7F1D1D}
    .conflict table{width:100%;border-collapse:collapse;margin-top:6px;background:#fff}
    .conflict td,.conflict th{border:1px solid #FECACA;padding:4px 6px;text-align:left}
    .p-status{display:block;font-size:11px;font-weight:700;margin-top:2px}
    td.st-active{box-shadow:inset 0 0 0 2px #5BD98A}
    td.st-active .p-status{color:#166534}
    td.st-wait .p-status{color:#B45309}
    td.st-done{opacity:.55}
    td.st-done .p-status{color:#6B7280}
    .td-free{background:#fff;cursor:pointer;text-align:center;vertical-align:middle!important;transition:background var(--tr)}
    .td-free:hover{background:var(--pri-lt)}
    .free-plus{font-size:20px;font-weight:300;color:var(--g300)}
    .td-free:hover .free-plus{color:var(--pri)}
    .td-past{background:var(--g50)}
    .p-name,.p-svc,.p-ins{display:block}
    .err{color:var(--red);font-size:13px;margin-bottom:10px}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center}
    .modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px}
    @media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:16px}}
    .modal-t{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--pri-dk)}
    .modal-close{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--g400);padding:0 4px;line-height:1}
    .qb-info{background:var(--pri-lt);border-radius:var(--rs);padding:10px 14px;margin-bottom:14px;font-size:14px;line-height:1.7;color:var(--pri-dk)}
    .dt-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--g100);font-size:14px}
    .dt-row:last-child{border:none}
    .dt-k{width:100px;flex-shrink:0;color:var(--g500)}
    .dt-v{font-weight:600;word-break:break-word}
    .dt-actions{display:flex;gap:8px;margin-top:16px}
    .dt-actions .btn{flex:1}
  </style>
</head>
<body>
  <div class="hdr">
    <div><h1>🏥 Admin แพทย์แผนจีน</h1><p>โรงพยาบาลควนโดน จ.สตูล</p></div>
    <div class="hdr-right">
      <div class="hdr-tag">ADMIN</div>
      <div class="win-badge" id="winBadge">📅 กำลังโหลดช่วงเปิดนัด…</div>
    </div>
  </div>
  <div class="tabs">
    <div class="tab on" data-t="queue" onclick="switchTab('queue')">📋 ดูคิว</div>
    <div class="tab" data-t="search" onclick="switchTab('search')">🔍 ค้นหาผู้ป่วย</div>
  </div>

  <!-- PANEL: คิว -->
  <div class="panel on" id="pQueue">
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
      <button onclick="changeDate(-1)" style="width:36px;height:36px;border-radius:var(--rs);border:1px solid var(--g200);background:#fff;font-size:16px;cursor:pointer">←</button>
      <input type="date" class="fi" id="qDate" onchange="updateDateLabel();loadQueue()" style="text-align:center;font-size:13px;padding:8px;font-weight:600;flex:1">
      <button onclick="changeDate(1)" style="width:36px;height:36px;border-radius:var(--rs);border:1px solid var(--g200);background:#fff;font-size:16px;cursor:pointer">→</button>
      <button onclick="goToday()" class="btn btn-p" style="font-size:11px;padding:8px 12px;white-space:nowrap">วันนี้</button>
      <button class="refresh-btn" id="refreshBtn" title="โหลดคิวใหม่ (ไม่ต้องกด F5)" onclick="loadQueue({silent:true})">🔄</button>
    </div>
    <div style="text-align:center;font-size:13px;color:var(--g500);margin-bottom:12px" id="dateLabel"></div>
    <div class="upd-note" id="updNote"></div>
    <div class="stats">
      <div class="stat"><div class="stat-n" id="stTotal">-</div><div class="stat-l">คิวทั้งหมด</div></div>
      <div class="stat"><div class="stat-n" id="stOnline" style="color:var(--pri)">-</div><div class="stat-l">จองออนไลน์</div></div>
      <div class="stat"><div class="stat-n" id="stWalkin" style="color:var(--gold)">-</div><div class="stat-l">Walk-in</div></div>
      <div class="stat"><div class="stat-n" id="stAdvance" style="color:#4F46E5">-</div><div class="stat-l">นัดล่วงหน้า</div></div>
    </div>
    <div id="conflictBox"></div>
    <div id="queueTable"><div class="ld"><div class="sp"></div>กำลังโหลดคิว...</div></div>
  </div>

  <!-- PANEL: ค้นหา -->
  <div class="panel" id="pSearch">
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <input type="text" class="fi" id="searchInput" placeholder="พิมพ์ชื่อ, HN หรือรหัสจอง..." style="flex:1" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn btn-p" onclick="doSearch()">🔍 ค้นหา</button>
    </div>
    <div id="searchResults"></div>
  </div>

  <!-- MODAL: รายละเอียดคิว -->
  <div class="modal-bg hidden" id="dtModal" onclick="if(event.target===this)this.classList.add('hidden')">
    <div class="modal">
      <button class="modal-close" onclick="document.getElementById('dtModal').classList.add('hidden')">&times;</button>
      <div class="modal-t" id="dtTitle">รายละเอียดคิว</div>
      <div id="dtBody"></div>
    </div>
  </div>

  <!-- MODAL: เพิ่มคิว (กด + ในตาราง) -->
  <div class="modal-bg hidden" id="qbModal" onclick="if(event.target===this)this.classList.add('hidden')">
    <div class="modal">
      <button class="modal-close" onclick="document.getElementById('qbModal').classList.add('hidden')">&times;</button>
      <div class="modal-t">➕ เพิ่มคิว</div>
      <div class="qb-info" id="qbInfo"></div>
      <div class="fg"><label class="fl">บริการ *</label><select class="fi" id="qbSvc"></select></div>
      <div class="fg"><label class="fl">ชื่อ-สกุลผู้ป่วย *</label><input type="text" class="fi" id="qbName" placeholder="กรอกชื่อ-สกุล"></div>
      <div class="fg"><label class="fl">HN</label><input type="text" class="fi" id="qbHn" placeholder="กรอก HN (ถ้ามี)"></div>
      <div class="fg"><label class="fl">เบอร์โทร</label><input type="tel" class="fi" id="qbPhone" placeholder="0xx-xxx-xxxx"></div>
      <div class="fg"><label class="fl">สิทธิ์การรักษา</label><select class="fi" id="qbIns"></select></div>
      <div class="fg"><label class="fl">หมายเหตุ</label><input type="text" class="fi" id="qbNote" placeholder="อาการ หรือข้อมูลเพิ่มเติม"></div>
      <div id="qbErr" class="err hidden"></div>
      <button class="btn btn-p" id="qbBtn" onclick="submitQuickBook()" style="width:100%;padding:14px">✅ ยืนยันเพิ่มคิว</button>
    </div>
  </div>

<script>
const API='https://script.google.com/macros/s/AKfycby_9sZ_k-wlWTxR9fhPgky7ICbTsgJWUd1WVqOLU_K5twn-Oybr4P1rO-3rHKo_tfuFyQ/exec';
const SLOTS=[
  {index:1,start:'09:00',end:'10:00',period:'เช้า'},
  {index:2,start:'10:00',end:'11:00',period:'เช้า'},
  {index:3,start:'11:00',end:'12:00',period:'เช้า'},
  {index:4,start:'13:30',end:'14:30',period:'บ่าย'},
  {index:5,start:'14:30',end:'15:30',period:'บ่าย'},
  {index:6,start:'15:30',end:'16:30',period:'บ่าย'},
];
const MAX=3; // จำนวนคนต่อช่วงเวลา
let todayStr='';
let allBookings=[];
let searchBookings=[];
let serviceList=[];
let insList=[];
let qbCtx=null;
const insMap={uc:'บัตรทอง',social_security:'ปกส.',government:'ขรก.',cash:'จ่ายเอง',other:'อื่นๆ'};

async function apiGet(a,p={}){const u=new URL(API);u.searchParams.set('action',a);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));return(await fetch(u)).json()}
async function apiPost(b){return(await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)})).json()}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// เวลาจาก Google Sheet บางครั้งมาเป็นวันที่ปี 1899 แบบ ISO เช่น "1899-12-30T04:17:56.000Z"
// ต้องแปลงกลับด้วยเขตเวลาไทย (Asia/Bangkok) ถ้าอ่านเป็น UTC ตรง ๆ เวลาจะเพี้ยน (11:00 กลายเป็น 04:18)
const TZ='Asia/Bangkok';
function safeTime(v){
  if(v==null||v==='')return'';
  const s=String(v).trim();
  if(/^\d{1,2}[:.]\d{2}/.test(s)){const[h,m]=s.split(/[:.]/);return h.padStart(2,'0')+':'+m.slice(0,2)}
  const d=new Date(s);
  if(isNaN(d))return s;
  const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(d).map(x=>[x.type,x.value]));
  let h=+parts.hour,m=+parts.minute;
  if(+parts.second>=30){m++;if(m===60){m=0;h=(h+1)%24}}
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
// วันที่จาก Sheet อาจมาเป็น ISO (เช่น "2026-09-28T17:00:00.000Z" = 29 ก.ย. เวลาไทย) → แปลงเป็น YYYY-MM-DD ตามเวลาไทย
function safeDate(v){
  if(!v)return'';
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const d=new Date(s);
  if(isNaN(d))return'';
  return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
}
// หาว่าคิวนี้อยู่ช่องเวลาไหน: ใช้ slot_index ถ้ามี ไม่งั้นเทียบจากเวลาเริ่ม
function slotOf(b){
  const idx=Number(b.slot_index);
  if(idx&&SLOTS.some(s=>s.index===idx))return idx;
  const t=safeTime(b.time_start);
  const s=SLOTS.find(x=>x.start===t);
  return s?s.index:null;
}
// วันที่วันนี้ตามเวลาเครื่อง (ไม่ใช้ toISOString เพราะก่อน 7 โมงเช้าจะได้วันของเมื่อวาน)
function localDateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function formatThaiDate(ds){const[y,m,dd]=String(ds).slice(0,10).split('-').map(Number);const d=new Date(y,m-1,dd);const dn=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];const mn=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return`วัน${dn[d.getDay()]}ที่ ${d.getDate()} ${mn[d.getMonth()]} ${d.getFullYear()+543}`}

async function init(){
  todayStr=localDateStr(new Date());
  document.getElementById('qDate').value=todayStr;
  updateDateLabel();
  // v3.1: โหลดพร้อมกัน (เดิมรอช่วงเปิดนัดก่อน แล้วค่อยโหลดคิว)
  loadBookingWindow();
  loadQueue();
  loadFormOptions();
  startAutoRefresh();
}

// ============ v3.1: จำข้อมูลที่ไม่ค่อยเปลี่ยน + โหลดคิวใหม่อัตโนมัติ ============
function readCache(key){try{const v=localStorage.getItem(key);return v?JSON.parse(v):null}catch(e){return null}}
function writeCache(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
const AUTO_REFRESH_MS=60000;
let queueLoading=false,queueReqId=0;
function anyModalOpen(){return['dtModal','qbModal'].some(id=>{const el=document.getElementById(id);return el&&!el.classList.contains('hidden')})}
function startAutoRefresh(){
  setInterval(()=>{
    if(document.visibilityState!=='visible')return;
    if(!document.getElementById('pQueue').classList.contains('on'))return;
    if(anyModalOpen()||queueLoading)return;
    loadQueue({silent:true});
  },AUTO_REFRESH_MS);
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&!anyModalOpen()&&!queueLoading)loadQueue({silent:true});
  });
}

// ============ v3: ช่วงเปิดนัด 30 วัน + วันหยุด/แพทย์ลา ============
let winInfo=null;
function addDays(iso,n){const[y,m,d]=iso.split('-').map(Number);return localDateStr(new Date(y,m-1,d+n))}
function shortThai(iso){const[y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);const dn=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];const mn=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return`${dn[dt.getDay()]} ${d} ${mn[m-1]} ${String(y+543).slice(2)}`}
async function loadBookingWindow(){
  const badge=document.getElementById('winBadge');
  try{
    const r=await apiGet('getBookingWindow');
    if(!r.success)throw new Error(r.error);
    winInfo=r;
    badge.innerHTML=`📅 เปิดนัดถึง <b>${shortThai(r.max_date)}</b>`;
    badge.title='หน้า admin นัดล่วงหน้าได้ '+r.admin_days+' วัน · วันอาทิตย์และวันในชีต Settings จองไม่ได้';
    const inp=document.getElementById('qDate');
    inp.min=addDays(r.today,-r.keep_days); inp.max=r.max_date;
    const box=document.getElementById('conflictBox');
    box.innerHTML=r.conflicts&&r.conflicts.length?`<div class="conflict">⚠️ <b>มีคนไข้ ${r.conflicts.length} รายนัดในวันหยุด/วันแพทย์ลา</b> — กรุณาโทรเลื่อนนัด
      <table><tr><th>วันที่</th><th>เวลา</th><th>ผู้ป่วย</th><th>โทร</th></tr>${r.conflicts.map(c=>`<tr><td>${shortThai(c.date)}</td><td>${esc(c.time_start)}</td><td>${esc(c.patient_name)}</td><td>${esc(c.patient_phone||'-')}</td></tr>`).join('')}</table></div>`:'';
  }catch(e){badge.textContent='📅 โหลดช่วงเปิดนัดไม่สำเร็จ'}
}
function isClosedDate(ds){
  if(winInfo&&winInfo.closed_dates&&winInfo.closed_dates.includes(ds))return true;
  const[y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).getDay()===0;
}

function updateDateLabel(){
  const ds=document.getElementById('qDate').value||todayStr;
  document.getElementById('dateLabel').innerHTML=`📅 ${formatThaiDate(ds)}${ds===todayStr?' · <b style="color:var(--pri)">วันนี้</b>':''}`;
}
function changeDate(n){
  const el=document.getElementById('qDate');
  const[y,m,d]=(el.value||todayStr).split('-').map(Number);
  let next=localDateStr(new Date(y,m-1,d+n));
  if(el.max&&next>el.max)next=el.max;
  if(el.min&&next<el.min)next=el.min;
  el.value=next;
  updateDateLabel();loadQueue();
}
function goToday(){document.getElementById('qDate').value=todayStr;updateDateLabel();loadQueue()}

async function loadQueue(opts){
  const silent=!!(opts&&opts.silent);
  const dateStr=document.getElementById('qDate').value||todayStr;
  const box=document.getElementById('queueTable');
  if(winInfo){
    const clear=()=>['stTotal','stOnline','stWalkin','stAdvance'].forEach(id=>document.getElementById(id).textContent='-');
    if(dateStr>winInfo.max_date){clear();box.innerHTML=`<div class="date-note">📅 วันนี้เกินช่วงเปิดนัด<br>หน้า admin นัดล่วงหน้าได้ถึง <b>${shortThai(winInfo.max_date)}</b> (${winInfo.admin_days} วัน)</div>`;return}
    if(dateStr<addDays(winInfo.today,-winInfo.keep_days)){clear();box.innerHTML=`<div class="date-note">🗂️ ข้อมูลนัดของวันนี้ถูกลบแล้ว<br>ระบบเก็บย้อนหลัง ${winInfo.keep_days} วัน · ดูได้จาก HosXP หรือตารางพิมพ์สำรอง</div>`;return}
  }
  if(!silent||!box.querySelector('table'))box.innerHTML='<div class="ld"><div class="sp"></div>กำลังโหลดคิว...</div>';
  const myReq=++queueReqId,btn=document.getElementById('refreshBtn');
  queueLoading=true;if(btn)btn.classList.add('spin');
  try{
    const res=await apiGet('getBookings',{date:dateStr});
    if(myReq!==queueReqId)return;
    if(!res.success){box.innerHTML='<div class="empty">❌ '+esc(res.error)+'</div>';return}
    allBookings=res.bookings||[];
    renderTable(allBookings);
    document.getElementById('updNote').textContent='อัปเดตล่าสุด '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' · โหลดใหม่เองทุก 1 นาที';
  }catch(e){
    if(myReq!==queueReqId)return;
    if(silent&&box.querySelector('table'))showToast('⚠️ โหลดคิวใหม่ไม่สำเร็จ จะลองใหม่อัตโนมัติ');
    else box.innerHTML='<div class="empty">❌ '+esc(e.message)+' — กดปุ่ม 🔄 เพื่อลองใหม่</div>';
  }finally{
    if(myReq===queueReqId){queueLoading=false;if(btn)btn.classList.remove('spin')}
  }
}

function renderTable(bookings){
  const box=document.getElementById('queueTable');
  const dateStr=document.getElementById('qDate').value||todayStr;
  const isPast=dateStr<todayStr;
  const isClosed=isClosedDate(dateStr);
  document.getElementById('stAdvance').textContent=bookings.filter(b=>b.booking_type==='advance').length;
  document.getElementById('stTotal').textContent=bookings.length;
  document.getElementById('stOnline').textContent=bookings.filter(b=>b.booking_type==='online').length;
  document.getElementById('stWalkin').textContent=bookings.filter(b=>b.booking_type==='walk-in').length;

  // ตาราง: แถว = ลำดับคนไข้ (1-3), คอลัมน์ = ช่วงเวลา
  const morningSlots=SLOTS.filter(s=>s.period==='เช้า');
  const afternoonSlots=SLOTS.filter(s=>s.period==='บ่าย');
  let html='<div class="tbl-wrap"><table class="tbl">';
  html+=`<tr><th class="th-num" rowspan="2">ลำดับ</th>`;
  html+=`<th class="th-period" colspan="${morningSlots.length}">ในเวลาราชการ (เช้า)</th>`;
  html+=`<th class="th-period" style="background:var(--gold);color:var(--g800)" colspan="${afternoonSlots.length}">ในเวลาราชการ (บ่าย)</th></tr>`;
  html+='<tr>'+SLOTS.map(s=>`<th class="th-time">${s.start}-${s.end}</th>`).join('')+'</tr>';

  for(let p=0;p<MAX;p++){
    html+=`<tr><td class="th-num" style="text-align:center;font-weight:700;vertical-align:middle">${p+1}</td>`;
    SLOTS.forEach(slot=>{
      const b=bookings.filter(x=>slotOf(x)===slot.index)[p];
      if(b){
        const isWalkin=b.booking_type==='walk-in';
        const ins=insMap[b.insurance_type]||'';
        const st=STATUS_MAP[b.service_status]||STATUS_MAP['รอเรียก'];
        const stName=STATUS_MAP[b.service_status]?b.service_status:'รอเรียก';
        html+=`<td class="${isWalkin?'td-walkin':(b.booking_type==='advance'?'td-advance':'td-booked')} ${st.cls}" onclick="viewDetail('${esc(b.booking_id)}')" style="cursor:pointer">
          <span class="p-name">${esc(b.patient_name||'-')}</span>
          <span class="p-svc">${esc(b.service_name||'')}</span>
          ${ins?`<span class="p-ins">${esc(ins)}</span>`:''}
          <span class="p-status">${st.ic} ${stName}</span>
          <div class="p-actions">
            ${isPast?'':`<button class="p-btn" style="background:${st.btnBg};color:${st.btnCol}" onclick="event.stopPropagation();cycleStatus('${esc(b.booking_id)}','${st.next}',this)">${st.btnTxt}</button>`}
            <button class="p-btn" style="background:var(--gold-lt);color:#7C6B2D" onclick="event.stopPropagation();printCard('${esc(b.booking_id)}')">🖨️</button>
            <button class="p-btn" style="background:#FEF2F2;color:var(--red)" onclick="event.stopPropagation();cancelBk('${esc(b.booking_id)}')">❌</button>
          </div>
        </td>`;
      }else if(isPast||isClosed){
        html+='<td class="td-past"></td>';
      }else{
        html+=`<td class="td-free" onclick="openQuickBook(${slot.index})" title="เพิ่มคิว ${slot.start}-${slot.end}"><span class="free-plus">+</span></td>`;
      }
    });
    html+='</tr>';
  }
  html+='</table></div>';
  if(isClosed&&!isPast)html='<div class="date-note">⛔ วันนี้คลินิกปิด / วันหยุด / แพทย์ลา — จองเพิ่มไม่ได้</div>'+html;
  html+='<div class="legend">🟢 จองออนไลน์ · 🟠 Walk-in · 🟣 นัดล่วงหน้า · <b>+</b> กดเพื่อเพิ่มคิว · <b>▶ เรียก</b> แล้วชื่อจะขึ้นจอทีวีเป็นสีเขียว · กดที่ชื่อเพื่อดูรายละเอียด</div>';
  box.innerHTML=html;
}

// ============ สถานะการรับบริการ (เชื่อมกับจอทีวี) ============
const STATUS_MAP={
  'รอเรียก':{cls:'st-wait',ic:'⏳',next:'กำลังรับบริการ',btnTxt:'▶ เรียก',btnBg:'#DCFCE7',btnCol:'#166534'},
  'กำลังรับบริการ':{cls:'st-active',ic:'🟢',next:'เสร็จแล้ว',btnTxt:'✓ เสร็จ',btnBg:'#E0E7FF',btnCol:'#3730A3'},
  'เสร็จแล้ว':{cls:'st-done',ic:'✅',next:'รอเรียก',btnTxt:'↺ รอ',btnBg:'#F3F4F6',btnCol:'#6B7280'},
};
async function cycleStatus(bid,nextStatus,btn){
  if(btn){btn.disabled=true;btn.textContent='⏳';}
  try{
    const res=await apiPost({action:'updateStatus',booking_id:bid,service_status:nextStatus});
    if(res.success){
      const msg={'กำลังรับบริการ':'▶ เรียกคิวแล้ว','เสร็จแล้ว':'✓ เสร็จสิ้น','รอเรียก':'↺ กลับเป็นรอเรียก'};
      showToast(msg[nextStatus]||'อัปเดตสถานะแล้ว');
      loadQueue();
    }else{alert('เกิดข้อผิดพลาด: '+(res.error||res.message));loadQueue()}
  }catch(e){alert('Error: '+e.message);loadQueue()}
}

// ============ รายละเอียดคิว ============
function findBooking(bid){return allBookings.find(x=>x.booking_id===bid)||searchBookings.find(x=>x.booking_id===bid)}

function viewDetail(bid){
  const b=findBooking(bid);if(!b)return;
  const ins=insMap[b.insurance_type]||b.insurance_type||'-';
  const row=(k,v)=>`<div class="dt-row"><span class="dt-k">${k}</span><span class="dt-v">${v}</span></div>`;
  let html=row('ชื่อ-สกุล',esc(b.patient_name||'-'))+row('HN',esc(b.patient_hn||'-'))
    +row('เบอร์โทร',esc(b.patient_phone||'-'))
    +row('เวลา',`${esc(safeTime(b.time_start))} – ${esc(safeTime(b.time_end))}`)
    +row('บริการ',esc(b.service_name||'-'))+row('สิทธิ์',esc(ins))
    +row('ประเภท',b.booking_type==='walk-in'?'Walk-in':'จองออนไลน์')
    +row('สถานะ',esc(b.service_status||'รอเรียก'));
  if(b.screening){try{const s=JSON.parse(b.screening);html+=row('คัดกรอง',Object.entries(s).map(([k,v])=>`${esc(k)}: ${esc(v)}`).join('<br>'))}catch(e){}}
  if(b.notes)html+=row('หมายเหตุ',esc(b.notes));
  html+=`<div class="dt-actions">
    <button class="btn btn-g" onclick="printCard('${esc(b.booking_id)}')">🖨️ พิมพ์ใบนัด</button>
    <button class="btn" style="background:#FEF2F2;color:var(--red)" onclick="cancelBk('${esc(b.booking_id)}')">❌ ยกเลิกคิว</button>
  </div>`;
  document.getElementById('dtTitle').textContent='📋 '+b.booking_id;
  document.getElementById('dtBody').innerHTML=html;
  document.getElementById('dtModal').classList.remove('hidden');
}

async function cancelBk(bid){
  if(!confirm('ยกเลิกคิว '+bid+' ?'))return;
  const res=await apiPost({action:'cancel',booking_id:bid,reason:'ยกเลิกโดยเจ้าหน้าที่'});
  if(res.success){document.getElementById('dtModal').classList.add('hidden');showToast('❌ ยกเลิกแล้ว');loadQueue()}
  else{alert('Error: '+(res.error||res.message))}
}

// ============ เพิ่มคิว (กด + ในตาราง) ============
async function loadFormOptions(){
  // v3.1: ใช้รายการที่จำไว้ในเครื่องทันที แล้วค่อยอัปเดตจากระบบ
  const c=readCache('tcm_form_v1');
  if(c){serviceList=c.s||[];insList=c.i||[]}
  try{
    const[svcR,insR]=await Promise.all([apiGet('getServices'),apiGet('getInsuranceTypes')]);
    if(svcR.success)serviceList=svcR.services||[];
    if(insR.success)insList=insR.insurance_types||[];
    writeCache('tcm_form_v1',{s:serviceList,i:insList});
  }catch(e){console.error(e)}
}

function openQuickBook(slotIndex){
  const slot=SLOTS.find(s=>s.index===slotIndex);if(!slot)return;
  const dateStr=document.getElementById('qDate').value||todayStr;
  qbCtx={slotIndex,dateStr,slot};
  document.getElementById('qbInfo').innerHTML=`📅 ${formatThaiDate(dateStr)}<br>🕐 ${slot.start} – ${slot.end} (${slot.period})`;
  document.getElementById('qbSvc').innerHTML=serviceList.length
    ?serviceList.map(s=>`<option value="${esc(s.id)}">${esc(s.icon||'')} ${esc(s.name)}</option>`).join('')
    :'<option value="">กำลังโหลดรายการบริการ...</option>';
  document.getElementById('qbIns').innerHTML=insList.length
    ?insList.map(t=>`<option value="${esc(t.id)}">${esc(t.icon||'')} ${esc(t.name)}</option>`).join('')
    :Object.entries(insMap).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  ['qbName','qbHn','qbPhone','qbNote'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('qbErr').classList.add('hidden');
  document.getElementById('qbModal').classList.remove('hidden');
  if(!serviceList.length)loadFormOptions().then(()=>{if(qbCtx&&qbCtx.slotIndex===slotIndex&&serviceList.length)openQuickBook(slotIndex)});
  setTimeout(()=>document.getElementById('qbName').focus(),100);
}

async function submitQuickBook(){
  if(!qbCtx)return;
  const name=document.getElementById('qbName').value.trim();
  const svc=document.getElementById('qbSvc').value;
  const errEl=document.getElementById('qbErr');
  if(!name||!svc){errEl.textContent=!name?'กรุณากรอกชื่อ-สกุล':'กรุณาเลือกบริการ';errEl.classList.remove('hidden');return}
  errEl.classList.add('hidden');
  const btn=document.getElementById('qbBtn');
  btn.disabled=true;btn.textContent='⏳ กำลังบันทึก...';
  try{
    const res=await apiPost({
      action:'walkin',
      date:qbCtx.dateStr,
      slot_index:qbCtx.slotIndex,
      service_id:svc,
      patient_name:name,
      patient_hn:document.getElementById('qbHn').value.trim(),
      patient_phone:document.getElementById('qbPhone').value.trim(),
      insurance_type:document.getElementById('qbIns').value,
      notes:document.getElementById('qbNote').value.trim(),
      booking_type:qbCtx.dateStr===todayStr?'walk-in':'advance',
    });
    if(res.success){
      document.getElementById('qbModal').classList.add('hidden');
      showToast('✅ เพิ่มคิวสำเร็จ');
      loadQueue();
    }else{errEl.textContent=res.error||res.message||'เกิดข้อผิดพลาด';errEl.classList.remove('hidden')}
  }catch(e){errEl.textContent='เกิดข้อผิดพลาด: '+e.message;errEl.classList.remove('hidden')}
  btn.disabled=false;btn.textContent='✅ ยืนยันเพิ่มคิว';
}

// ============ ค้นหา ============
async function doSearch(){
  const q=document.getElementById('searchInput').value.trim();
  if(!q)return;
  const box=document.getElementById('searchResults');
  box.innerHTML='<div class="ld"><div class="sp"></div>กำลังค้นหา...</div>';
  try{
    const res=await apiGet('searchPatient',{q:q});
    searchBookings=(res.success&&res.bookings)||[];
    if(!searchBookings.length){box.innerHTML='<div class="empty">ไม่พบข้อมูล</div>';return}
    box.innerHTML=searchBookings.map(b=>{
      const ins=insMap[b.insurance_type]||b.insurance_type||'-';
      const active=b.status!=='cancelled';
      return`<div class="search-result">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;gap:8px">
          <b>${esc(b.patient_name)}</b><span style="font-size:12px;color:var(--g400)">${esc(b.booking_id)}</span>
        </div>
        <div style="font-size:13px;color:var(--g600)">
          📅 ${esc(b.date_thai||b.date)} · 🕐 ${esc(safeTime(b.time_start))}–${esc(safeTime(b.time_end))} · ${esc(b.service_name)} · ${esc(ins)}
          · <span style="color:${active?'var(--pri)':'var(--red)'}">${esc(b.status)}</span>
        </div>
        ${active?`<button class="p-btn" style="margin-top:6px;background:var(--gold-lt);color:#7C6B2D;font-size:12px;padding:4px 10px" onclick="printCard('${esc(b.booking_id)}')">🖨️ พิมพ์ใบนัด</button>`:''}
      </div>`;
    }).join('');
  }catch(e){box.innerHTML='<div class="empty">❌ '+esc(e.message)+'</div>'}
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.dataset.t===t));
  document.getElementById('pQueue').classList.toggle('on',t==='queue');
  document.getElementById('pSearch').classList.toggle('on',t==='search');
  if(t==='search')document.getElementById('searchInput').focus();
}

// ตั้งค่าเหมือนหน้าแผนไทย: ในหน้าต่างพิมพ์ต้องเลือก "ระยะขอบ = ไม่มี"
const SLIP_ROLL_LEN_MM=120;

  const dateStr=safeDate(b.date)||document.getElementById('qDate').value||todayStr;

  const printedAt=new Date().toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'});

  if(!w){alert('เบราว์เซอร์บล็อกหน้าต่างพิมพ์ กรุณาอนุญาต Pop-up สำหรับเว็บนี้');return}
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ใบนัด ${esc(b.booking_id)}</title>

  @media screen{html,body{height:auto;overflow:visible}body{background:#ddd;padding:12px;width:auto}.slip{background:#fff;margin:0 auto;box-shadow:0 1px 6px rgba(0,0,0,.3)}}

  .h2{font-size:8pt;line-height:1.3}

    Promise.race([ready,new Promise(function(r){setTimeout(r,3000)})]).then(function(){

function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}

document.addEventListener('DOMContentLoaded',init);
